name: Build macOS packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            arch: arm64
          - runner: macos-15-intel
            rid: osx-x64
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build ${{ matrix.rid }}
        run: bash src/scripts/build-${{ matrix.rid }}.sh
      - name: Check architecture
        shell: bash
        run: |
          for binary in xObsBeam.dylib libQoirLib.dylib libdensity.dylib; do
            lipo -verify_arch "${{ matrix.arch }}" "src/publish/${{ matrix.rid }}/$binary"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.rid }}
          path: |
            src/publish/${{ matrix.rid }}/xObsBeam.dylib
            src/publish/${{ matrix.rid }}/libQoirLib.dylib
            src/publish/${{ matrix.rid }}/libdensity.dylib
          if-no-files-found: error

  package:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: osx-arm64
          path: src/publish/osx-arm64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: osx-x64
          path: src/publish/osx-x64
      - name: Create universal plugin and packages
        shell: bash
        run: |
          SKIP_ARCH_BUILDS=1 bash src/scripts/build-macos-universal.sh
          bash src/scripts/release-macos-universal.sh
      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          release=src/release/macos-universal
          bundle="$release/xObsBeam.plugin/Contents"
          test -f "$bundle/Info.plist"
          test -f "$bundle/Resources/locale/en-US.ini"
          for binary in xObsBeam libQoirLib.dylib libdensity.dylib; do
            lipo -verify_arch arm64 x86_64 "$bundle/MacOS/$binary"
          done
          archive=( "$release"/xObsBeam-*-macos-universal.tar.xz )
          installer=( "$release"/xObsBeam-*-macos-universal.pkg )
          uninstaller=( "$release"/xObsBeam-*-macos-universal-uninstaller.pkg )
          test -f "${archive[0]}"
          test -f "${installer[0]}"
          test -f "${uninstaller[0]}"
          tar -tJf "${archive[0]}" | grep -Fx 'xObsBeam.plugin/Contents/MacOS/xObsBeam'
          tar -xJf "${archive[0]}" -C "$RUNNER_TEMP"
          cmp "$bundle/MacOS/xObsBeam" "$RUNNER_TEMP/xObsBeam.plugin/Contents/MacOS/xObsBeam"
          pkgutil --payload-files "${installer[0]}" | grep -F 'xObsBeam.plugin/Contents/MacOS/xObsBeam'
          pkgutil --expand "${installer[0]}" "$RUNNER_TEMP/installer"
          test -f "$RUNNER_TEMP/installer/Scripts/postinstall"
          pkgutil --expand "${uninstaller[0]}" "$RUNNER_TEMP/uninstaller"
          test -f "$RUNNER_TEMP/uninstaller/Scripts/postinstall"
          echo "Packages are unsigned; signing and notarization require Apple Developer credentials."
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: xObsBeam-macos-universal-unsigned
          path: |
            src/release/macos-universal/*.tar.xz
            src/release/macos-universal/*.pkg
          if-no-files-found: error
